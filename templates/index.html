<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Astrologer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>&#10024; AI Astrologer</h1>
    <p class="sub">Real birth chart calculations, interpreted by an LLM.</p>

    <form id="form">
      <label>Name (optional)
        <input id="name" type="text" maxlength="40" placeholder="Star traveler">
      </label>
      <div class="row">
        <label>Date of birth
          <input id="dob" type="date" required>
        </label>
        <label>Time of birth
          <input id="time" type="time" required>
        </label>
      </div>
      <label>Place of birth
        <input id="place" type="text" required placeholder="City, Country (e.g. Hyderabad, India)">
      </label>
      <div class="row">
        <label>Forecast for
          <select id="period">{% for p in periods %}<option>{{ p }}</option>{% endfor %}</select>
        </label>
        <label>Focus
          <select id="focus">{% for f in focuses %}<option>{{ f }}</option>{% endfor %}</select>
        </label>
      </div>
      <label>Tone
        <select id="tone">{% for t in tones %}<option value="{{ t }}">{{ t|capitalize }}</option>{% endfor %}</select>
      </label>
      <button id="go" type="submit">Read my stars</button>
    </form>
    <p id="error" class="error" hidden></p>

    <section id="result" hidden>
      <img id="plate" class="plate" alt="" hidden>
      <small id="plateCap" class="credit"></small>
      <div class="big3" id="big3"></div>
      <h2>Birth chart</h2>
      <small id="where"></small>
      <table id="chart">
        <thead><tr><th>Body</th><th>Sign</th><th>Degree</th><th>House</th></tr></thead>
        <tbody></tbody>
      </table>
      <h2>Reading</h2>
      <div id="reading"></div>
      <small>Generated by AI from computed chart data (Groq). For entertainment only. Background: NASA/ESA/CSA Webb Telescope, Carina Nebula.</small>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

    function markdown(md) {
      const out = [];
      let list = false;
      for (const raw of esc(md).split("\n")) {
        const line = raw.trim();
        const item = line.match(/^(?:[-*]|\d+\.)\s+(.*)/);
        if (!item && list) { out.push("</ul>"); list = false; }
        if (!line || /^-{3,}$/.test(line)) continue;
        const h = line.replace(/^\*\*(.*)\*\*$/, "$1").match(/^#{1,4}\s+(.*)/);
        if (h) out.push(`<h3>${inline(h[1])}</h3>`);
        else if (item) {
          if (!list) { out.push("<ul>"); list = true; }
          out.push(`<li>${inline(item[1])}</li>`);
        } else out.push(`<p>${inline(line)}</p>`);
      }
      if (list) out.push("</ul>");
      return out.join("");
    }

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("error").hidden = true;
      $("result").hidden = true;
      $("go").disabled = true;
      $("go").textContent = "Reading the sky...";
      try {
        const res = await fetch("/api/reading", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: $("name").value, dob: $("dob").value, time: $("time").value,
            place: $("place").value, period: $("period").value,
            focus: $("focus").value, tone: $("tone").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Something went wrong");

        const c = data.chart, p = c.planets;
        const sun = p.Sun.sign.toLowerCase();
        $("plate").src = `/static/img/${sun}.${sun === "sagittarius" ? "png" : "jpg"}`;
        $("plate").alt = `${p.Sun.sign} constellation`;
        $("plate").hidden = false;
        $("plateCap").textContent = `${p.Sun.sign}: Sidney Hall, Urania's Mirror (1824), public domain`;
        $("big3").innerHTML = [["Sun", p.Sun.sign], ["Moon", p.Moon.sign], ["Rising", c.ascendant.sign]]
          .map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join("");
        $("where").textContent = `${c.place} (${c.timezone}, UTC${c.utc_offset})`;
        const rows = [["Ascendant", c.ascendant, 1], ["Midheaven", c.midheaven, 10]]
          .concat(Object.entries(p).map(([n, v]) => [n + (v.retrograde ? " (R)" : ""), v, v.house]));
        $("chart").querySelector("tbody").innerHTML = rows
          .map(([n, v, h]) => `<tr><td>${esc(n)}</td><td>${esc(v.sign)}</td><td>${v.degree.toFixed(1)}&deg;</td><td>${h}</td></tr>`).join("");
        $("reading").innerHTML = markdown(data.reading);
        $("result").hidden = false;
      } catch (err) {
        $("error").textContent = err.message;
        $("error").hidden = false;
      } finally {
        $("go").disabled = false;
        $("go").textContent = "Read my stars";
      }
    });
  </script>
</body>
</html>
